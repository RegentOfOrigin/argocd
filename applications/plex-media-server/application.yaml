apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plex-media-server
  annotations:
    argocd.argoproj.io/sync-wave: '10'
    link.argocd.argoproj.io/application: 'https://plex.lexrj.com'
spec:
  project: default
  destination:
    name: in-cluster
    namespace: plex
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
  source:
    repoURL: https://github.com/RegentOfOrigin/argocd.git
    path: charts/plex-media-server
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
        - values-lexrj.yaml
